name: "Emu third-party dependencies (Windows)"

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (empty = latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: "write"
  actions: "write"

env:
  PREMAKE_ACTION: "vs2026"
  DEPS_CACHE_KEY: "emu-deps-win"
  DEPS_CACHE_DIR: "build/deps/win"

  PACKAGE_BASE_DIR: "build/package/win"
  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps-build:
    runs-on: "windows-2025-vs2026"
    if: ${{ !cancelled() }}

    steps:
      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: ${{ github.workspace }}
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      # checkout first so that git clean does not wipe the restored cache
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Compute cache key suffix"
        id: "cache_key"
        shell: "bash"
        run: |
          branch="${{ inputs.branch || 'dev' }}"
          common_win_sha=$(git rev-parse HEAD:third-party/common/win)
          deps_win_sha=$(git rev-parse HEAD:third-party/deps/win)
          deps_common_sha=$(git rev-parse HEAD:third-party/deps/common)
          echo "value=${branch}-$(echo ${deps_common_sha} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "common_win_sha=${common_win_sha}" >> $GITHUB_OUTPUT
          echo "deps_win_sha=${deps_win_sha}" >> $GITHUB_OUTPUT
          echo "deps_common_sha=${deps_common_sha}" >> $GITHUB_OUTPUT

      - name: "Restore combined deps cache"
        id: "cache-deps-restore"
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          key: "deps-win-${{ env.PREMAKE_ACTION }}-${{ steps.cache_key.outputs.value }}"
          restore-keys: |
            emu-deps-win-all-${{ env.PREMAKE_ACTION }}-
            emu-deps-win-all-${{ env.PREMAKE_ACTION }}
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"

      # determine if any dep needs (re)building
      - name: "Check if any dep rebuild needed"
        id: "needs-build"
        shell: "bash"
        run: |
          any=false
          ssq_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/libssq"
          zlib_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/zlib"
          mbedtls_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/mbedtls"
          curl_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/curl"
          protobuf_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/protobuf"
          overlay_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/ingame_overlay"
          opus_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/opus"
          portaudio_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/portaudio"
          sdl_dir="${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/sdl"

          [[ ! -d "$ssq_dir"       || "${{ inputs.rebuild_ssq }}"            == "true" ]] && { any=true; echo "build_ssq=true"            >> $GITHUB_OUTPUT; } || echo "build_ssq=false"            >> $GITHUB_OUTPUT
          [[ ! -d "$zlib_dir"      || "${{ inputs.rebuild_zlib }}"           == "true" ]] && { any=true; echo "build_zlib=true"           >> $GITHUB_OUTPUT; } || echo "build_zlib=false"           >> $GITHUB_OUTPUT
          [[ ! -d "$mbedtls_dir"   || "${{ inputs.rebuild_mbedtls }}"        == "true" ]] && { any=true; echo "build_mbedtls=true"        >> $GITHUB_OUTPUT; } || echo "build_mbedtls=false"        >> $GITHUB_OUTPUT
          [[ ! -d "$curl_dir"      || "${{ inputs.rebuild_curl }}"           == "true" ]] && { any=true; echo "build_curl=true"           >> $GITHUB_OUTPUT; } || echo "build_curl=false"           >> $GITHUB_OUTPUT
          [[ ! -d "$protobuf_dir"  || "${{ inputs.rebuild_protobuf }}"       == "true" ]] && { any=true; echo "build_protobuf=true"       >> $GITHUB_OUTPUT; } || echo "build_protobuf=false"       >> $GITHUB_OUTPUT
          [[ ! -d "$overlay_dir"   || "${{ inputs.rebuild_ingame_overlay }}" == "true" ]] && { any=true; echo "build_ingame_overlay=true" >> $GITHUB_OUTPUT; } || echo "build_ingame_overlay=false" >> $GITHUB_OUTPUT
          [[ ! -d "$opus_dir"      || "${{ inputs.rebuild_opus }}"           == "true" ]] && { any=true; echo "build_opus=true"           >> $GITHUB_OUTPUT; } || echo "build_opus=false"           >> $GITHUB_OUTPUT
          [[ ! -d "$portaudio_dir" || "${{ inputs.rebuild_portaudio }}"      == "true" ]] && { any=true; echo "build_portaudio=true"      >> $GITHUB_OUTPUT; } || echo "build_portaudio=false"      >> $GITHUB_OUTPUT
          [[ ! -d "$sdl_dir"       || "${{ inputs.rebuild_sdl }}"            == "true" ]] && { any=true; echo "build_sdl=true"            >> $GITHUB_OUTPUT; } || echo "build_sdl=false"            >> $GITHUB_OUTPUT

          echo "needed=$any" >> $GITHUB_OUTPUT

      # clone sources only when at least one dep needs building

      - name: "Clone third-party deps (common/win)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v6
        with:
          ref: "${{ steps.cache_key.outputs.common_win_sha }}"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (deps/win)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v6
        with:
          ref: "${{ steps.cache_key.outputs.deps_win_sha }}"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Clone third-party deps (deps/common)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v6
        with:
          ref: "${{ steps.cache_key.outputs.deps_common_sha }}"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/common"

      # per-dep build steps (only run when cache missed or force-rebuild requested)
      - name: "Build ssq"
        if: steps.needs-build.outputs.build_ssq == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-ssq --build-ssq --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build zlib"
        if: steps.needs-build.outputs.build_zlib == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-zlib --build-zlib --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build mbedtls"
        if: steps.needs-build.outputs.build_mbedtls == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-mbedtls --build-mbedtls --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build curl"
        if: |
          steps.needs-build.outputs.build_curl == 'true' ||
          steps.needs-build.outputs.build_zlib == 'true' ||
          steps.needs-build.outputs.build_mbedtls == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-curl --build-curl --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build protobuf"
        if: |
          steps.needs-build.outputs.build_protobuf == 'true' ||
          steps.needs-build.outputs.build_zlib == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-protobuf --build-protobuf --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build ingame_overlay"
        if: steps.needs-build.outputs.build_ingame_overlay == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-ingame_overlay --build-ingame_overlay --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build opus"
        if: steps.needs-build.outputs.build_opus == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-opus --build-opus --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build portaudio"
        if: steps.needs-build.outputs.build_portaudio == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-portaudio --build-portaudio --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Build sdl"
        if: steps.needs-build.outputs.build_sdl == 'true'
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          set "CMAKE_GENERATOR=Visual Studio 18 2026"
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5-deps.lua --ext-sdl --build-sdl --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=windows vs2026

      - name: "Delete existing combined deps cache"
        if: steps.needs-build.outputs.needed == 'true'
        continue-on-error: true
        shell: "bash"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete "deps-win-${{ env.PREMAKE_ACTION }}-${{ steps.cache_key.outputs.value }}" --repo "${{ github.repository }}" || true

      - name: "Save combined deps cache"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/cache/save@v5
        with:
          key: "deps-win-${{ env.PREMAKE_ACTION }}-${{ steps.cache_key.outputs.value }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"
