name: "Emu third-party dependencies (Linux)"

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (empty = latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "gmake"
  DEPS_CACHE_KEY: "emu-deps-linux"
  DEPS_CACHE_DIR: "build/deps/linux"

  PACKAGE_BASE_DIR: "build/package/linux"
  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps-build:
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() }}

    steps:
      # per-dep cache lookups
      - name: "Lookup cache for ssq"
        id: "cache-ssq"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-ssq-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/libssq"

      - name: "Lookup cache for zlib"
        id: "cache-zlib"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-zlib-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/zlib"

      - name: "Lookup cache for mbedtls"
        id: "cache-mbedtls"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-mbedtls-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/mbedtls"

      - name: "Lookup cache for curl"
        id: "cache-curl"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-curl-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/curl"

      - name: "Lookup cache for protobuf"
        id: "cache-protobuf"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-protobuf-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/protobuf"

      - name: "Lookup cache for ingame_overlay"
        id: "cache-ingame-overlay"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-ingame-overlay-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/ingame_overlay"

      - name: "Lookup cache for opus"
        id: "cache-opus"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-opus-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/opus"

      - name: "Lookup cache for portaudio"
        id: "cache-portaudio"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-portaudio-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/portaudio"

      - name: "Lookup cache for sdl"
        id: "cache-sdl"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-sdl-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/sdl"

      # determine if any dep needs (re)building
      - name: "Check if any dep rebuild needed"
        id: "needs-build"
        shell: "bash"
        run: |
          any=false
          if [[ "${{ steps.cache-ssq.outputs.cache-hit }}"            != "true" ]] || [[ "${{ inputs.rebuild_ssq }}"            == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-zlib.outputs.cache-hit }}"           != "true" ]] || [[ "${{ inputs.rebuild_zlib }}"           == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-mbedtls.outputs.cache-hit }}"        != "true" ]] || [[ "${{ inputs.rebuild_mbedtls }}"        == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-curl.outputs.cache-hit }}"           != "true" ]] || [[ "${{ inputs.rebuild_curl }}"           == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-protobuf.outputs.cache-hit }}"       != "true" ]] || [[ "${{ inputs.rebuild_protobuf }}"       == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-ingame-overlay.outputs.cache-hit }}" != "true" ]] || [[ "${{ inputs.rebuild_ingame_overlay }}" == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-opus.outputs.cache-hit }}"           != "true" ]] || [[ "${{ inputs.rebuild_opus }}"           == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-portaudio.outputs.cache-hit }}"      != "true" ]] || [[ "${{ inputs.rebuild_portaudio }}"      == "true" ]]; then any=true; fi
          if [[ "${{ steps.cache-sdl.outputs.cache-hit }}"            != "true" ]] || [[ "${{ inputs.rebuild_sdl }}"            == "true" ]]; then any=true; fi
          echo "needed=$any" >> $GITHUB_OUTPUT

      # checkout and clone sources only when at least one dep needs building
      - name: "Checkout branch"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Clone third-party deps (common/linux)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party deps (deps/linux)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      - name: "Clone third-party deps (deps/common)"
        if: steps.needs-build.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: "third-party/deps/common"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/common"

      # fix folder permissions
      - name: "Give all permissions to repo folder"
        if: steps.needs-build.outputs.needed == 'true'
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}"

      # mandatory Linux packages
      - name: "Install required packages"
        if: steps.needs-build.outputs.needed == 'true'
        shell: "bash"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -y
          sudo apt install -y coreutils # echo, printf, etc...
          sudo apt install -y build-essential
          sudo apt install -y gcc-multilib # needed for 32-bit builds
          sudo apt install -y g++-multilib
          # sudo apt install -y clang
          sudo apt install -y libglx-dev # needed for overlay build (header files such as GL/glx.h)
          sudo apt install -y libgl-dev # needed for overlay build (header files such as GL/gl.h)
          sudo apt install -y libx11-dev:i386 # needed for overlay build
          # sudo apt install -y binutils # (optional) contains the tool 'readelf' mainly, and other usefull binary stuff

      - name: "Set premake5 permissions"
        if: steps.needs-build.outputs.needed == 'true'
        shell: "bash"
        run: sudo chmod 777 ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5

      # per-dep build steps (only run when cache missed or force-rebuild requested)
      - name: "Build ssq"
        if: steps.cache-ssq.outputs.cache-hit != 'true' || inputs.rebuild_ssq == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-ssq --build-ssq --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build zlib"
        if: steps.cache-zlib.outputs.cache-hit != 'true' || inputs.rebuild_zlib == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-zlib --build-zlib --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build mbedtls"
        if: steps.cache-mbedtls.outputs.cache-hit != 'true' || inputs.rebuild_mbedtls == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-mbedtls --build-mbedtls --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build curl"
        if: |
          steps.cache-curl.outputs.cache-hit != 'true' ||
          inputs.rebuild_curl == true ||
          steps.cache-zlib.outputs.cache-hit != 'true' ||
          inputs.rebuild_zlib == true ||
          steps.cache-mbedtls.outputs.cache-hit != 'true' ||
          inputs.rebuild_mbedtls == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-curl --build-curl --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build protobuf"
        if: |
          steps.cache-protobuf.outputs.cache-hit != 'true' ||
          inputs.rebuild_protobuf == true ||
          steps.cache-zlib.outputs.cache-hit != 'true' ||
          inputs.rebuild_zlib == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-protobuf --build-protobuf --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build ingame_overlay"
        if: steps.cache-ingame-overlay.outputs.cache-hit != 'true' || inputs.rebuild_ingame_overlay == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-ingame_overlay --build-ingame_overlay --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build opus"
        if: steps.cache-opus.outputs.cache-hit != 'true' || inputs.rebuild_opus == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-opus --build-opus --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build portaudio"
        if: steps.cache-portaudio.outputs.cache-hit != 'true' || inputs.rebuild_portaudio == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-portaudio --build-portaudio --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake

      - name: "Build sdl"
        if: steps.cache-sdl.outputs.cache-hit != 'true' || inputs.rebuild_sdl == true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          export CMAKE_GENERATOR="Unix Makefiles"
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5-deps.lua --ext-sdl --build-sdl --64-build --32-build --j=${{ env.MAX_PARALLEL_JOBS }} --verbose --clean --os=linux gmake
