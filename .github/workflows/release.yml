name: "Prepare release"

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false
      vs_version:
        description: 'Visual Studio version to build with (vs2026, vs2022, or both)'
        type: choice
        options:
          - vs2026
          - vs2022
          - both
        default: 'vs2026'
      build_arm:
        description: 'Also build the ARM64 variants (Windows + Linux)'
        type: boolean
        default: false

permissions:
  contents: "write"
  actions: "write"

env:
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  # windows_arm64 is VS2026-only: the arm deps are built with
  # "--arm-build" + "Visual Studio 18 2026" and there is no windows-2022 arm runner.
  emu-win-all-vs2026:
    name: "Build Windows, VS2026, x64/x86"
    if: ${{ !cancelled() && (inputs.vs_version == '' || inputs.vs_version == 'vs2026' || inputs.vs_version == 'both') }}
    uses: "./.github/workflows/emu-build-all-win.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  emu-win-all-vs22:
    name: "Build Windows, VS2022, x64/x86"
    if: ${{ !cancelled() && (inputs.vs_version == 'vs2022' || inputs.vs_version == 'both') }}
    uses: "./.github/workflows/emu-build-all-win-vs22.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  # The toolchain choice gates these jobs directly, without a "select" job feeding a
  # dynamic matrix: a matrix built from a needs output cannot be expanded until that
  # job finishes, so its legs (and their names) stay unresolved in the run graph.
  # These two jobs are independent -- each packages into its own
  # build/package/win/<toolchain> folder and, on tags, uploads its own
  # emu-win-{release,debug}-<toolchain>.7z -- so they may run in parallel.
  emu-win-prep-vs2026:
    name: "Package Windows, VS2026, x64/x86"
    needs: ["emu-win-all-vs2026"]
    if: ${{ !cancelled() && (inputs.vs_version == '' || inputs.vs_version == 'vs2026' || inputs.vs_version == 'both') }}
    runs-on: "windows-2025-vs2026"
    steps:
      # we need branch because it has package scripts
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      # download artifacts
      - name: "Download emu build artifacts (Win)"
        uses: actions/download-artifact@v8
        with:
          path: "build/win"
          pattern: "emu-win-vs2026-*-${{ steps.build_ref.outputs.sha }}"
          merge-multiple: true

      # print files
      - name: "Print files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          dir /s /b /a:-d build\win

      # package (release mode)
      - name: "Package build (release)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\release

      # package (debug mode)
      - name: "Package build (debug)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\debug 1

      # the vs2026 and vs2022 archives would otherwise share the same asset name
      - name: "Rename packages"
        if: startsWith(github.ref, 'refs/tags/')
        shell: "cmd"
        working-directory: "build/package/win/vs2026"
        run: |
          ren emu-win-debug.7z emu-win-debug-vs2026.7z
          ren emu-win-release.7z emu-win-release-vs2026.7z

      # release (debug + release modes) if this is a tag push
      - name: "Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/win/vs2026/**/*"

      # upload artifacts/packages if this is a manual run
      - name: "Upload release package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-vs2026-release-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2026/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Upload debug package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-vs2026-debug-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2026/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

  emu-win-prep-vs22:
    name: "Package Windows, VS2022, x64/x86"
    needs: ["emu-win-all-vs22"]
    if: ${{ !cancelled() && (inputs.vs_version == 'vs2022' || inputs.vs_version == 'both') }}
    runs-on: "windows-2025-vs2026"
    steps:
      # we need branch because it has package scripts
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      # download artifacts
      - name: "Download emu build artifacts (Win)"
        uses: actions/download-artifact@v8
        with:
          path: "build/win"
          pattern: "emu-win-vs2022-*-${{ steps.build_ref.outputs.sha }}"
          merge-multiple: true

      # print files
      - name: "Print files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          dir /s /b /a:-d build\win

      # package (release mode)
      - name: "Package build (release)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2022\release

      # package (debug mode)
      - name: "Package build (debug)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2022\debug 1

      # the vs2026 and vs2022 archives would otherwise share the same asset name
      - name: "Rename packages"
        if: startsWith(github.ref, 'refs/tags/')
        shell: "cmd"
        working-directory: "build/package/win/vs2022"
        run: |
          ren emu-win-debug.7z emu-win-debug-vs2022.7z
          ren emu-win-release.7z emu-win-release-vs2022.7z

      # release (debug + release modes) if this is a tag push
      - name: "Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/win/vs2022/**/*"

      # upload artifacts/packages if this is a manual run
      - name: "Upload release package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-vs2022-release-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2022/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Upload debug package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-vs2022-debug-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2022/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

  # One final job, so it waits for every packaging leg (Windows x64/x86, Windows ARM64,
  # Linux x64/x86, Linux ARM64). Running it earlier would race with a leg that still
  # has to download its build artifacts.
  emu-cleanup:
    name: "Clean up intermediate build artifacts"
    needs: ["emu-win-prep-vs2026", "emu-win-prep-vs22", "emu-win-arm-prep", "emu-linux-prep", "emu-linux-arm-prep"]
    if: ${{ !cancelled() }}
    runs-on: "ubuntu-latest"
    steps:
      - name: "Delete intermediate build artifacts"
        continue-on-error: true
        shell: "bash"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          gh api "repos/${repo}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^(emu-win-|emu-winarm-|emu-linux-|emu-linuxarm-|proto-gen-)")) | .id' | \
          while IFS= read -r artifact_id; do
            gh api -X DELETE "repos/${repo}/actions/artifacts/${artifact_id}" \
              && echo "Deleted artifact ${artifact_id}" \
              || echo "Failed to delete artifact ${artifact_id}"
          done

  emu-linux-all:
    name: "Build Linux, gmake2, x64/x86"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-build-all-linux.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  emu-linux-prep:
    name: "Package Linux, gmake2, x64/x86"
    needs: ["emu-linux-all"]
    runs-on: "ubuntu-24.04"
    steps:
      # we need branch because it has package scripts
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Clone third-party deps (deps/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      # download artifacts
      - name: "Download emu build artifacts (linux)"
        uses: actions/download-artifact@v8
        with:
          path: "build/linux"
          pattern: "emu-linux-*-${{ steps.build_ref.outputs.sha }}"
          merge-multiple: true

      # fix folder permissions! not sure why this fails
      # nested subdirs "build/linux/release" cause permission problems
      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}" && sudo chmod 777 package_linux.sh

      # print files
      - name: "Print files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          ls -la build/linux/*/*

      # downlaod ubuntu packages
      - name: "Download required Ubuntu packages"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo apt update || exit 1
          sudo apt install tar -y || exit 1

      # package (release mode)
      - name: "Package build (release)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/release

      # package (debug mode)
      - name: "Package build (debug)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/debug 1

      # release (debug + release modes) if this is a tag push
      - name: "Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/linux/**/*"

      # upload artifacts/packages if this is a manual run
      - name: "Upload release package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-release-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/linux/gmake/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Upload debug package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-debug-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/linux/gmake/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------------------
  # ARM64 variants, ported from upstream (gbe_fork).
  # Disabled by default: enable with the "build_arm" workflow input.
  # See dev.notes/ for the ARM toolchain + deps requirements.
  # ---------------------------------------------------------------------------

  emu-win-arm-all:
    name: "Build Windows, VS2026, ARM64"
    if: ${{ !cancelled() && inputs.build_arm }}
    uses: "./.github/workflows/emu-build-all-win-arm.yml"

  emu-win-arm-prep:
    name: "Package Windows, VS2026, ARM64"
    needs: ["emu-win-arm-all"]
    if: ${{ !cancelled() && inputs.build_arm }}
    runs-on: "windows-11-vs2026-arm"
    steps:
      # we need branch because it has package scripts
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Clone third-party deps (deps/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      # download artifacts
      - name: "Download emu build artifacts (Win ARM64)"
        uses: actions/download-artifact@v8
        with:
          path: "build/win"
          pattern: "emu-winarm-*-${{ github.sha }}"
          merge-multiple: true

      # print files
      - name: "Print files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          dir /s /b /a:-d build\win

      # package (release mode)
      - name: "Package build (release)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\release

      # package (debug mode)
      - name: "Package build (debug)"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\debug 1

      # Rename
      - name: "Rename"
        if: startsWith(github.ref, 'refs/tags/')
        shell: "cmd"
        working-directory: "build/package/win/vs2026"
        run: |
          ren emu-win-debug.7z emu-winarm-debug-vs26.7z
          ren emu-win-release.7z emu-winarm-release-vs26.7z

      # release (debug + release modes) if this is a tag push
      - name: "Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/win/**/*"

      # upload artifacts/packages if this is a manual run
      - name: "Upload release package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-winarm-vs26-release-${{ github.sha }}"
          path: "build/package/win/vs2026/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7

      - name: "Upload debug package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-winarm-vs26-debug-${{ github.sha }}"
          path: "build/package/win/vs2026/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7

  emu-linux-arm-all:
    name: "Build Linux, gmake2, ARM64"
    if: ${{ !cancelled() && inputs.build_arm }}
    uses: "./.github/workflows/emu-build-all-linux-arm.yml"

  emu-linux-arm-prep:
    name: "Package Linux, gmake2, ARM64"
    needs: ["emu-linux-arm-all"]
    if: ${{ !cancelled() && inputs.build_arm }}
    runs-on: "ubuntu-24.04-arm"
    steps:
      # we need branch because it has package scripts
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Clone third-party deps (deps/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      # download artifacts
      - name: "Download emu build artifacts (linux ARM64)"
        uses: actions/download-artifact@v8
        with:
          path: "build/linux"
          pattern: "emu-linuxarm-*-${{ github.sha }}"
          merge-multiple: true

      # fix folder permissions! not sure why this fails
      # nested subdirs "build/linux/release" cause permission problems
      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}" && sudo chmod 777 package_linux.sh

      # print files
      - name: "Print files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          ls -la build/linux/*/*

      # downlaod ubuntu packages
      - name: "Download required Ubuntu packages"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo apt update || exit 1
          sudo apt install tar -y || exit 1

      # package (release mode)
      - name: "Package build (release)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/release

      # package (debug mode)
      - name: "Package build (debug)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/debug 1

      # release (debug + release modes) if this is a tag push
      - name: "Release"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/linux/**/*"

      # upload artifacts/packages if this is a manual run
      - name: "Upload release package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-arm-release-${{ github.sha }}"
          path: "build/package/linux/gmake/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7

      - name: "Upload debug package"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-arm-debug-${{ github.sha }}"
          path: "build/package/linux/gmake/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
