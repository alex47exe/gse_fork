name: "Build emu (Windows)"

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (empty = latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false
      deps_sha:
        description: 'Short SHA of third-party/deps/common (leave empty to compute at runtime)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: "write"
  actions: "write"

env:
  PREMAKE_ACTION: "vs2026"
  DEPS_CACHE_KEY: "emu-deps-win"
  DEPS_CACHE_DIR: "build/deps/win"

  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-win.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}
      deps_sha: ${{ inputs.deps_sha || '' }}

  gen-proto:
    name: "Generate proto files - *.pb.cc, *.pb.h"
    needs: ["deps"]
    runs-on: "windows-2025-vs2026"
    if: ${{ !cancelled() }}

    steps:
      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Restore combined deps cache"
        uses: actions/cache/restore@v5
        with:
          key: "deps-win-${{ env.PREMAKE_ACTION }}-${{ inputs.branch || 'dev' }}-${{ inputs.deps_sha }}"
          restore-keys: |
            deps-win-${{ env.PREMAKE_ACTION }}-
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"
          fail-on-cache-miss: true

      - name: "Clone third-party build helpers (common/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Set build date"
        shell: "bash"
        run: echo "EMU_BUILD_DATE=$(date +%Y_%m_%d)" >> $GITHUB_ENV

      - name: "Generate proto files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --genproto_only --os=windows vs2026

      - name: "Upload proto_gen artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "proto-gen-win-vs2026-${{ steps.build_ref.outputs.sha }}"
          path: "proto_gen/win"
          if-no-files-found: "error"
          retention-days: 1
          overwrite: true

  builds-matrix-win:
    name: "build"
    needs: ["deps", "gen-proto"]
    runs-on: "windows-2025-vs2026"
    if: ${{ !cancelled() }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        prj: [
            # regular api
            "api_regular",
            # (experimental) api + client
            "api_experimental",
            "steamclient_experimental_stub",
            # client (experimental) + loader + extra dll + gameoverlaylib
            "steamclient_experimental",
            "steamclient_experimental_loader",
            "steamclient_experimental_extra",
            "lib_game_overlay_renderer",
            # steam old lib
            "lib_steam_old",
            # tools
            "tool_lobby_connect",
            "tool_generate_interfaces",
            # reshade addon overlay
            "reshade_addon_overlay",
          ]
        cfg: ["debug", "release"]

    steps:
      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      # ensure we have msbuild
      - name: "Add MSBuild to PATH"
        uses: microsoft/setup-msbuild@v3

      # clone branch
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # deps
      - name: "Restore combined deps cache"
        uses: actions/cache/restore@v5
        with:
          key: "deps-win-${{ env.PREMAKE_ACTION }}-${{ inputs.branch || 'dev' }}-${{ inputs.deps_sha }}"
          restore-keys: |
            deps-win-${{ env.PREMAKE_ACTION }}-
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"
          fail-on-cache-miss: true

      # extra helpers/tools, these are not built inside the deps build dir
      - name: "Clone third-party build helpers (common/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (build/win)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/build/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/win"

      # generate project files
      - name: "Set build date"
        shell: "bash"
        run: echo "EMU_BUILD_DATE=$(date +%Y_%m_%d)" >> $GITHUB_ENV
        
      - name: "Generate proto files - *.pb.cc, *.pb.h"
        id: "gen_proto_attempt"
        continue-on-error: true
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --genproto_only --emubuild=${{ steps.build_ref.outputs.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --dosstub --winrsrc --winsign --os=windows vs2026

      - name: "Download proto files artifact (fallback)"
        if: steps.gen_proto_attempt.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: "proto-gen-win-vs2026-${{ steps.build_ref.outputs.sha }}"
          path: "proto_gen/win"

      - name: "Generate project files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --emubuild=${{ steps.build_ref.outputs.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --dosstub --winrsrc --winsign --os=windows vs2026

      # build target
      - name: "Build x64"
        if: matrix.prj != 'lib_steam_old'
        shell: "cmd"
        working-directory: "${{ github.workspace }}/build/project/vs2026/win"
        run: |
          msbuild /nologo /target:${{ matrix.prj }} /m:1 -p:CL_MPCount=${{ env.MAX_PARALLEL_JOBS }} /v:n /p:Configuration=${{ matrix.cfg }},Platform=x64 gse.slnx

      - name: "Build Win32"
        shell: "cmd"
        working-directory: "${{ github.workspace }}/build/project/vs2026/win"
        run: |
          msbuild /nologo /target:${{ matrix.prj }} /m:1 -p:CL_MPCount=${{ env.MAX_PARALLEL_JOBS }} /v:n /p:Configuration=${{ matrix.cfg }},Platform=Win32 gse.slnx

      # upload artifact/package to github Actions
      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "emu-win-${{ matrix.prj }}-${{ matrix.cfg }}-${{ steps.build_ref.outputs.sha }}"
          path: "build/win"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
          overwrite: true
