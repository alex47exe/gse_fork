name: "Build emu (Windows)"

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (empty = latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "vs2026"
  DEPS_CACHE_KEY: "emu-deps-win"
  DEPS_CACHE_DIR: "build/deps/win"

  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-win.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  builds-matrix-win:
    name: "build"
    needs: ["deps"]
    runs-on: "windows-2025-vs2026"
    if: ${{ !cancelled() }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        prj: [
            # regular api
            "api_regular",
            # (experimental) api + client
            "api_experimental",
            "steamclient_experimental_stub",
            # client (experimental) + loader + extra dll + gameoverlaylib
            "steamclient_experimental",
            "steamclient_experimental_loader",
            "steamclient_experimental_extra",
            "lib_game_overlay_renderer",
            # steam old lib
            "lib_steam_old",
            # tools
            "tool_lobby_connect",
            "tool_generate_interfaces",
            # reshade addon overlay
            "reshade_addon_overlay",
          ]
        arch: ["x64", "Win32"]
        cfg: ["debug", "release"]

        exclude:
          - prj: lib_steam_old
            arch: x64

    steps:
      # on Windows Git will auto change line ending to CRLF, not preferable
      - name: "Ensure LF line ending"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      # ensure we have msbuild
      - name: "Add MSBuild to PATH"
        uses: microsoft/setup-msbuild@v2

      # clone branch
      - name: "Checkout branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT






      # deps
      - name: "Restore deps (ssq)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-ssq-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/libssq"

      - name: "Restore deps (zlib)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-zlib-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/zlib"

      - name: "Restore deps (mbedtls)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-mbedtls-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/mbedtls"

      - name: "Restore deps (curl)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-curl-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/curl"

      - name: "Restore deps (protobuf)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-protobuf-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/protobuf"

      - name: "Restore deps (ingame_overlay)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-ingame-overlay-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/ingame_overlay"

      - name: "Restore deps (opus)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-opus-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/opus"

      - name: "Restore deps (portaudio)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-portaudio-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/portaudio"

      - name: "Restore deps (sdl)"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-sdl-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}/sdl"

      # extra helpers/tools, these are not built inside the deps build dir
      - name: "Clone third-party build helpers (common/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/common/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/win"

      - name: "Clone third-party deps (build/win)"
        uses: actions/checkout@v4
        with:
          ref: "third-party/build/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/win"

      # generate project files
      - name: "Set build date"
        shell: "bash"
        run: echo "EMU_BUILD_DATE=$(date +%Y_%m_%d)" >> $GITHUB_ENV

      - name: "Generate project files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          "${{env.THIRD_PARTY_BASE_DIR}}\common\win\premake\premake5.exe" --file=premake5.lua --genproto --emubuild=${{ steps.build_ref.outputs.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --dosstub --winrsrc --winsign --os=windows vs2026

      # build target
      - name: "Build target"
        shell: "cmd"
        working-directory: "${{ github.workspace }}/build/project/vs2026/win"
        run: |
          msbuild /nologo /target:${{ matrix.prj }} /m:1 -p:CL_MPCount=${{ env.MAX_PARALLEL_JOBS }} /v:n /p:Configuration=${{ matrix.cfg }},Platform=${{ matrix.arch }} gse.slnx

      # upload artifact/package to github Actions
      - name: "Upload target package"
        uses: actions/upload-artifact@v4
        with:
          name: "emu-win-${{ matrix.prj }}-${{ matrix.cfg }}-${{ matrix.arch }}-${{ steps.build_ref.outputs.sha }}"
          path: "build/win"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
          overwrite: true