name: "Build emu (Linux, gmake2, ARM64)"

on:
  workflow_call:
    # needed since it allows this to become a reusable workflow
  workflow_dispatch:
    # allows manual trigger

permissions:
  contents: "write"

env:
  # premake 5.0.0-beta8 resolves the 'gmake2' action to 'gmake', which is also the
  # directory name it writes to (build/project/gmake, build/deps/linux/gmake)
  PREMAKE_ACTION: "gmake"
  DEPS_CACHE_KEY: "emu-deps-linux-arm"
  DEPS_CACHE_DIR: "build/deps/linux"

  PACKAGE_BASE_DIR: "build/package/linux"
  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-linux-arm.yml"

  gen-proto:
    name: "Generate proto files - *.pb.cc, *.pb.h"
    needs: ["deps"]
    runs-on: "ubuntu-24.04-arm"
    if: ${{ !cancelled() }}

    steps:
      - name: "Checkout branch"
        uses: actions/checkout@v6

      - name: "Restore deps"
        uses: actions/cache/restore@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"

      - name: "Clone third-party build helpers (common/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Generate proto files"
        continue-on-error: true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo chmod 777 ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5 --file=premake5.lua --genproto_only --os=linux gmake2

      - name: "Upload proto_gen artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "proto-gen-linux-arm-${{ env.PREMAKE_ACTION }}-${{ github.sha }}"
          path: "proto_gen/linux"
          if-no-files-found: "warn"
          retention-days: 1
          overwrite: true

  builds-matrix-linux:
    name: "build"
    needs: ["deps", "gen-proto"]
    runs-on: "ubuntu-24.04-arm"
    if: ${{ !cancelled() }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        prj: [
            # regular api
            "api_regular",
            "steamclient_regular",
            # api + client (experimental)
            "api_experimental",
            "steamclient_experimental",
            # tools
            "tool_lobby_connect",
            "tool_generate_interfaces",
            # tests
            "test_gamepad_linux",
          ]
        arch: ["arm64"]
        cfg: ["debug", "release"]

    steps:
      # clone branch
      - name: "Checkout branch"
        uses: actions/checkout@v6

      # deps
      - name: "Restore deps"
        id: "emu-deps-cache-step"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"

      # extra helpers/tools, these are not built inside the deps build dir
      - name: "Clone third-party build helpers (common/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party build helpers (build/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/build/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/linux"

      # fix folder permissions! not sure why this fails
      # nested subdirs "build/linux/release" cause permission problems
      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}"

      # generate project files
      - name: "Set build date"
        shell: "bash"
        run: echo "EMU_BUILD_DATE=$(date +%Y_%m_%d)" >> $GITHUB_ENV

      - name: "Generate proto files - *.pb.cc, *.pb.h"
        id: "gen_proto_attempt"
        continue-on-error: true
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo chmod 777 ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5 --file=premake5.lua --genproto_only --emubuild=${{ github.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --os=linux gmake2

      - name: "Download proto files artifact (fallback)"
        if: steps.gen_proto_attempt.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: "proto-gen-linux-arm-${{ env.PREMAKE_ACTION }}-${{ github.sha }}"
          path: "proto_gen/linux"

      - name: "Generate project files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo chmod 777 ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake-arm/premake5 --file=premake5.lua --emubuild=${{ github.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --os=linux gmake2

      # mandatory Linux packages
      - name: "Install required packages"
        shell: "bash"
        run: |
          sudo apt update -y
          sudo apt install -y coreutils # echo, printf, etc...
          sudo apt install -y build-essential
          # sudo apt install -y clang
          sudo apt install -y libglx-dev # needed for overlay build (header files such as GL/glx.h)
          sudo apt install -y libgl-dev # needed for overlay build (header files such as GL/gl.h)
          sudo apt install -y libx11-dev # needed for overlay build
          # need for overlay
          sudo apt install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxcb1-dev libxcb-keysyms1-dev libxcb-xinput-dev libxcb-xkb-dev
          # sudo apt install -y binutils # (optional) contains the tool 'readelf' mainly, and other usefull binary stuff

      # build target
      - name: "Build target"
        shell: "bash"
        working-directory: "${{ github.workspace }}/build/project/gmake/linux"
        run: |
          echo "dry run..."
          make -n -j ${{ env.MAX_PARALLEL_JOBS }} config=${{ matrix.cfg }}_${{ matrix.arch }} ${{ matrix.prj }}
          echo "actual run..."
          make -j ${{ env.MAX_PARALLEL_JOBS }} config=${{ matrix.cfg }}_${{ matrix.arch }} ${{ matrix.prj }}

      # upload artifact/package to github Actions
      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "emu-linuxarm-${{ matrix.prj }}-${{ matrix.cfg }}-${{ matrix.arch }}-${{ github.sha }}"
          path: "build/linux"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
