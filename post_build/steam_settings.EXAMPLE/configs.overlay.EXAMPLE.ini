[overlay::reshade]
# disable the ReShade startup banner ("ReShade X.X loaded" overlay notification)
# writes [OVERLAY] ShowStartupBanner=0 to the game's ReShade.ini
# only takes effect if ReShade is detected (local proxy or SK plugin)
# 1=disable the banner
# 0=leave ReShade's default behavior (default)
# default=0
disable_reshade_banner=0
# 1=enable the overlay bridge for the ReShade addon without hooking the renderer
# this allows the ReShade addon (gse_reshade_overlay_addon) to render the overlay
# even when enable_experimental_overlay=0 (the native overlay is disabled)
# the bridge only provides data (achievements, notifications, friends, etc.)
# while the ReShade addon handles all the rendering
# default=0
enable_experimental_bridge=0

[overlay::general]
# 1=enable the experimental overlay - might cause crashes or other problems, so USE AT YOUR OWN RISK
# default=0
enable_experimental_overlay=0
# 1=suppress the GameOverlayActivated_t callback when the overlay opens/closes
# many games pause gameplay when they receive this callback
# enable this if you don't want the game to pause when the overlay is open
# default=0
disable_overlay_activated_callback=0
# amount of time to wait before attempting to detect and hook the renderer (DirectX, OpenGL, Vulkan, etc...)
# default=0
hook_delay_sec=0
# timeout for the renderer detector
# default=15
renderer_detector_timeout_sec=15
# 1=disable the achievements notifications
# default=0
disable_achievement_notification=0
# 1=disable friends invitations and messages notifications
# default=0
disable_friend_notification=0
# 1=disable showing notifications for achievements progress
# default=1
disable_achievement_progress=1
# 1=disable any warning in the overlay
# default=0
disable_warning_any=0
# 1=disable the bad app ID warning in the overlay
# default=0
disable_warning_bad_appid=0
# 1=disable the local_save warning in the overlay
# default=0
disable_warning_local_save=0
# by default the overlay will attempt to upload the achievements icons to the GPU
# so that they are displayed, in rare cases this might keep failing and cause FPS drop
# 0=prevent the overlay from attempting to upload the icons periodically,
#   in that case achievements icons won't be displayed
# default=1
upload_achievements_icons_to_gpu=1
# 1=sort achievements list by global unlock percentage (requires an internet connection)
# default=0
sort_achievements_by_global_percent=0
# amount of frames to accumulate, to eventually calculate the average frametime (in milliseconds)
# lower values would result in instantaneous frametime/fps, but the FPS would be erratic
# higher values would result in a more stable frametime/fps, but will be inaccurate due to averaging over long time
# minimum allowed value = 1
# default=10
fps_averaging_window=10
# 1=always show user info in the overlay
# default=0
overlay_always_show_user_info=0
# 1=always show fps in the overlay
# default=0
overlay_always_show_fps=0
# 1=always show frametime in the overlay
# default=0
overlay_always_show_frametime=0
# 1=always show playtime in the overlay
# default=0
overlay_always_show_playtime=0
# 1=show the FPS graph in the overlay performance stats display
# default=1
overlay_show_fps_graph=1
# 1=show the frametime graph in the overlay performance stats display
# default=1
overlay_show_frametime_graph=1
# 1=show min/max/average values in the overlay performance stats display
# default=1
overlay_show_min_max_avg=1
# 1=show 1% low percentile in the overlay performance stats display
# default=1
overlay_show_percentile_1=1
# 1=show 5% low percentile in the overlay performance stats display
# default=1
overlay_show_percentile_5=1
# 1=show 0.1% low percentile in the overlay performance stats display
# default=0
overlay_show_percentile_01=0
# time window (in seconds) used for the overlay performance graphs, valid range: 1-30
# default=5
overlay_graph_timeframe_sec=5
# 1=enable the F12 screenshot feature
# 0=disable the F12 screenshot hotkey (gallery/pins remain available)
# default=1
enable_screenshot=1
# shows or hides the buttons and checkboxes on the overlay
# 1=shows the selected button
# 0=hides the selected button
# default=1 --- disabled by gse_fork, as the the overlay is now fully functional without the need to show/hide buttons
#show_button_user_info=1
#show_button_achievements=1
#show_button_test_achievement=1
#show_button_copy_id=1
#show_button_screenshots=1
#show_button_history=1
#show_button_settings=1
#show_checkbox_fps=1
#show_checkbox_frametime=1
#show_checkbox_playtime=1

[overlay::logging]
# overlay logging control
# debug deps builds (`premake5-deps --debug-build`) compile ingame_overlay with spdlog enabled
# and default compile-time log level set to trace
# release deps builds keep logging disabled at compile time
# default=0
overlay_log_enabled=0
# available values: trace, debug, info, warn, error, critical, off
# default=info
overlay_log_level=info
# absolute or relative path to overlay log file
# default=steam_settings/logs/ingame_overlay.log
overlay_log_file=steam_settings/logs/ingame_overlay.log

[overlay::hotkeys]
# combination of keys used to show/hide the overlay
# available values:
#   shift
#   ctrl
#   alt
#   tab
#   fn1
#   fn2
#   ...
#   ...
#   fn12
# 
# you can use the '+' sign to combine multiple keys
# example: ctrl + shift + fn5
# 
# default=shift + tab
key_combo=shift + tab
# combination of keys used to take a screenshot (same syntax as key_combo above)
# default=f12
screenshot_combo=f12

[overlay::specialk]
# automatically start Special K's injection service when the game starts
# if SKIF is already running, it sends "Start Temp" to trigger injection
# if SKIF is NOT running, the emu will try to find and launch it automatically:
#   1. checks 'specialk_install_path' if set
#   2. checks default location: %LOCALAPPDATA%\Programs\Special K\SKIF.exe
# waits up to 10 seconds for SK to inject, the service auto-stops after injection
# 1=auto-start SK injection
# 0=don't auto-start (default)
# default=0
auto_inject_specialk=0
# path to SKIF.exe for auto-injection (used when SKIF is not already running)
# can be a full path to SKIF.exe or just the folder containing it
# if empty, the emu uses the default install location (%LOCALAPPDATA%/Programs/Special K/)
# default=(empty)
specialk_install_path=
# how long the SK injection service stays running (in seconds)
# useful for games with separate launchers/settings apps that load steam_api before the game exe
# 0=use Temp mode (auto-stop after first successful injection, best for direct game launches)
# >0=keep the service running for this many seconds then stop, giving the real game exe time to start
# example: 30 = service stays active for 30 seconds, enough for most launchers to start the game
# default=0
specialk_service_duration=0
# disable the Special K startup notification/OSD toast
# writes [SpecialK.System] Silent=true to the per-game SK profile INI
# only takes effect if Special K is detected or auto-injected
# 1=suppress SK startup notification
# 0=leave SK's default behavior (default)
# default=0
disable_specialk_notification=0

