# ############################# #
# Image gamma/colour correction before GPU upload.
# ingame_overlay forces a UNORM render-target-view on its own render pass, so sRGB-encoded
# texture bytes are written to the back buffer without any hardware gamma correction.
# The overlay now detects the swap-chain colour space automatically and applies the
# appropriate transform:
#
#   FP16 / FP32 / 16-bit UNORM (scRGB linear HDR):
#     sRGB -> linear + SDR-white-level scaling + Reinhard soft-shoulder tone map.
#
#   HDR10 (R10G10B10A2, PQ / ST.2084):
#     sRGB -> linear -> PQ encode at SDR-white nit level.
#
#   _SRGB render-target view (e.g. R8G8B8A8_UNORM_SRGB):
#     sRGB -> linear only  (hardware re-encodes sRGB on write).
#
#   8-bit SDR UNORM / DX9 / OpenGL:
#     No transform needed — pass-through.
#
# auto = apply the correct transform based on detected swap-chain format
# on   = always decode sRGB->linear (legacy; use Swapchain_Override for finer control)
# off  = never decode (original behaviour, no colour correction)
# default=auto
Image_Gamma=auto

# ############################# #
# Manual swap-chain colour-space override.
# Normally the overlay detects the back-buffer format from the first rendered frame and
# selects the right colour transform automatically (see Image_Gamma above).
# Use this setting ONLY if auto-detection gives wrong results — for example, some OpenGL games
# use GL_FRAMEBUFFER_SRGB which cannot be detected from the format alone.
#
# auto       = trust the detected format (recommended)
# linear_hdr = force scRGB / linear HDR path (sRGB->linear + SDR-white scale)
# hdr10_pq   = force HDR10 PQ path (sRGB->linear->PQ encode)
# srgb_rtv   = force _SRGB render-target-view path (sRGB->linear, hw re-encodes)
# sdr        = force plain SDR UNORM (no transform)
# default=auto
Swapchain_Override=auto
# ############################# #
